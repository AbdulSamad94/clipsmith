services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3.5:4b}"]
    restart: "no"

  clipsmith:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      CLIPSMITH_DATA_DIR: /app/data
      # To allow access from LAN or a reverse proxy, add hostnames/IPs (comma-separated):
      # CLIPSMITH_ALLOWED_HOSTS: clips.example.com,192.168.1.50
    volumes:
      - clipsmith_data:/app/data
    restart: unless-stopped

volumes:
  ollama_data:
  clipsmith_data:
